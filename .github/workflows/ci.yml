name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: verify-go-pin
        run: |
          # The Docker builder must use exactly the go.mod toolchain: a
          # floating golang:1.27-alpine tag would build release images with
          # a different stdlib than the tested binaries.
          GO_MOD="$(grep -E '^go ' go.mod | awk '{print $2}')"
          GO_DOCKER="$(grep -E '^ARG GO_VERSION=' Dockerfile | cut -d= -f2)"
          if [ "$GO_MOD" != "$GO_DOCKER" ]; then
            echo "::error::Go version drift: go.mod wants $GO_MOD, Dockerfile pins $GO_DOCKER — bump ARG GO_VERSION in the Dockerfile together with go.mod"
            exit 1
          fi
          echo "Go pin OK: $GO_DOCKER"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Single source of truth: the go directive in go.mod (pinned to a
          # patch line for stdlib vulnerability fixes, see the deps commit).
          go-version-file: go.mod

      - name: gofmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "::error::gofmt found issues:"
            gofmt -l .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: go tool staticcheck ./...

      - name: govulncheck
        run: go tool govulncheck ./...

      - name: Test
        run: go test -coverprofile=coverage.out ./...

      - name: SonarCloud Scan
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: SonarSource/sonarcloud-github-action@383f7e52eae3ab0510c3cb0e7d9d150bbaeab838 # v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
